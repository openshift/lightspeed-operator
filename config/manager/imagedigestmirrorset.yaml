# The images are pulled from our redhat-user-workloads registry or staging registry while the production image is not yet available.
kind: ImageDigestMirrorSet
apiVersion: config.openshift.io/v1
metadata:
  name: openshift-lightspeed-prod-to-ci
spec:
  imageDigestMirrors:
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-rhel9-operator
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/ols/lightspeed-operator
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-operator-bundle
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/ols-bundle
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-service-api-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/ols/lightspeed-service
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-agentic-rhel9-operator
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-agentic-operator
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-agentic-console-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-agentic-console
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-agentic-alerts-adapter-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-agentic-alerts-adapter
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-agentic-sandbox-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-agentic-sandbox
    - source: registry.redhat.io/openshift-lightspeed/otelcol-lightspeed-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/lightspeed-otel-collector
    - source: registry.redhat.io/openshift-lightspeed/lightspeed-console-plugin-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/crt-nshift-lightspeed-tenant/ols/lightspeed-console

