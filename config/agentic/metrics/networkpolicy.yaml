apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentic-operator-metrics
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: lightspeed-agentic-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: k8s
      ports:
        - port: 8443
          protocol: TCP
