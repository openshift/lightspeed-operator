apiVersion: v1
kind: Service
metadata:
  name: agentic-operator-metrics
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: agentic-operator-metrics-certs
  labels:
    app.kubernetes.io/name: agentic-operator-metrics
spec:
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: lightspeed-agentic-operator
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
      protocol: TCP
