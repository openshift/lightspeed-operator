# Agentic controller manager (OLS-3188).
# Second deployment shipped in the v2 (OCP >= 5.0) bundle only, alongside the
# classic lightspeed-operator controller. Sourced from the agentic-operator repo
# (config/manager/manager.yaml, config/rbac/service_account.yaml); keep in sync
# via the CRD/RBAC sync target (OLS-3189). Do not hand-edit the rule/spec content.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightspeed-agentic-operator-controller-manager
  namespace: openshift-lightspeed
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/part-of: lightspeed-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-agentic-operator-controller-manager
  namespace: openshift-lightspeed
  labels:
    control-plane: agentic-controller-manager
    app.kubernetes.io/component: manager
    app.kubernetes.io/part-of: lightspeed-operator
spec:
  selector:
    matchLabels:
      control-plane: agentic-controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: agentic-controller-manager
    spec:
      serviceAccountName: lightspeed-agentic-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Placeholder image; update_bundle.sh v2 substitutes the pinned digest
          # from related_images.json (entry "lightspeed-agentic-operator").
          image: lightspeed-agentic-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --namespace=openshift-lightspeed
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 9443
              name: webhook
              protocol: TCP
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: webhook-certs
          secret:
            secretName: agentic-operator-webhook-certs
            optional: true
