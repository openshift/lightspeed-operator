# Binds namespace-scoped Secret read access to the agentic controller.
# `system` is transformed by the v2 Kustomize assembly to the deployed namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-operator-manager-secret-reader
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: agentic-controller-manager
    namespace: system
