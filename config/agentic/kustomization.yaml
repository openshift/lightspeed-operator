# Agentic controller inputs for the single bundle on OCP 4.x and 5.0+.
# The agentic controller remains inactive below 5.0 via its runtime gate.
# CRDs, RBAC, and webhook inputs are synced from the pinned agentic-operator repo.
# Direct child directories mirror upstream config except samples; only
# adapted resources below are packaged. Do not hand-edit synced inputs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manager.yaml
  - role.yaml
  - role_binding.yaml
  - run_approver_role.yaml
  - run_approver_binding.yaml
  - crd
  - manifests.yaml
  - service.yaml
