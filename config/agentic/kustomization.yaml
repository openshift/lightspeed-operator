# Agentic controller inputs for the single bundle on OCP 4.x and 5.0+.
# The agentic controller remains inactive below 5.0 via its runtime gate.
# CRDs and RBAC originate in the agentic-operator repo; do not hand-edit them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manager.yaml
  - role.yaml
  - role_binding.yaml
  - run_approver_role.yaml
  - run_approver_binding.yaml
  - crds
  - manifests.yaml
  - service.yaml
