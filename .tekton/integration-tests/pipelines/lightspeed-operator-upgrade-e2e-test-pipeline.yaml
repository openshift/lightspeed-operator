---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  annotations:
    pipelinesascode.tekton.dev/task: "[ols-installer, ols-e2e-task]"
  name: ols-integration-tests-pipeline
spec:
  description: |
    Runs OpenShift Lightspeed operator upgrade e2e tests on a Konflux ephemeral OpenShift cluster (EaaS):
    provision cluster, OLM-install the second-newest catalog bundle (latest-1 semver among bundle-v*.yaml; avoids
    known-bad upgrade chains from very old bases), skip final bundle in ols-install, run make test-upgrade to
    bundle-upgrade to the snapshot bundle, gather artifacts, deprovision.

    Per OpenShift minor: set params.openshift-version-prefix (e.g. 4.16.) and params.test-name (Konflux integration
    test id). Base bundle is the penultimate semver in lightspeed-catalog-<minor>; upgrade targets the snapshot
    bundle (SNAPSHOT + component label).
  params:
    - name: SNAPSHOT
      description: 'The JSON string representing the snapshot of the application under test.'
      default: '{"components": [{"name":"test-app", "containerImage": "quay.io/example/repo:latest"}]}'
      type: string
    - name: test-name
      description: 'The name of the test corresponding to a defined Konflux integration test.'
      default: 'ols-upgrade-e2e-tests-4.22'
      type: string
    - name: namespace
      description: 'Namespace to run tests in'
      default: 'openshift-lightspeed'
      type: string
    - name: openshift-version-prefix
      description: 'OpenShift minor version to provision (for example, 4.22).'
      default: '4.22'
      type: string
  tasks:
    - name: provision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/provision-ephemeral-cluster/0.1/provision-ephemeral-cluster.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: workflow
          value: hypershift-hostedcluster-workflow
        - name: clusterProfile
          value: aws-konflux-prod
        - name: env
          value: '{"COMPUTE_NODE_TYPE": "m5.2xlarge", "HYPERSHIFT_NODE_COUNT": "3", "HOSTED_MANAGEMENT_CLUSTER": "hosted-mgmt2"}'
        - name: releases
          value: '{"latest":{"release":{"channel":"stable","version":"$(params.openshift-version-prefix)","architecture":"multi"}}}'
    - name: ols-install
      description: Install operator bundle (upgrade base + snapshot); record SNAPSHOT commit for tests.
      runAfter:
        - provision-ephemeral-cluster
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: namespace
          value: "$(params.namespace)"
        - name: openshift-version-prefix
          value: "$(params.openshift-version-prefix)."
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      taskSpec:
        results:
          - name: commit
            value: "$(steps.get-snapshot-component.results.commit)"
        params:
          - name: SNAPSHOT
          - name: namespace
          - name: openshift-version-prefix
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: cluster-credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: install-operator
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: OLS_NAMESPACE
                value: "$(params.namespace)"
              - name: UPGRADE_E2E_INSTALL_OLD_BASE_FROM_CATALOG
                value: "$(params.openshift-version-prefix)"
            volumeMounts:
              - name: cluster-credentials
                mountPath: /credentials
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              set -euo pipefail
              dnf -y install jq python3-pip git curl yq
              COMMIT="$(jq -r --arg component_name "${KONFLUX_COMPONENT_NAME}" '.components[] | select(.name == $component_name) | .source.git.revision' <<< "$SNAPSHOT")"
              echo "Cloning lightspeed-operator@${COMMIT} for Konflux operator install"
              rm -rf /workspace/lightspeed-operator
              mkdir -p /workspace/lightspeed-operator
              cd /workspace/lightspeed-operator
              git init -q
              git remote add origin https://github.com/openshift/lightspeed-operator.git
              git fetch --depth 1 origin "${COMMIT}"
              git checkout -q FETCH_HEAD
              ./.tekton/integration-tests/scripts/run-konflux-operator-install.sh bundle
          - name: get-snapshot-component
            image: registry.redhat.io/openshift4/ose-cli:latest
            env:
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
            results:
              - name: commit
                type: string
                description: "commit sha to be used to store artifacts"
            script: |
              dnf -y install jq
              echo -n "$(jq -r --arg component_name "${KONFLUX_COMPONENT_NAME}" '.components[] | select(.name == $component_name) | .source.git.revision' <<< "$SNAPSHOT")" > $(step.results.commit.path)
    - name: ols-operator-tests
      description: Task to run tests from operator repository
      params:
        - name: commit
          value: $(tasks.ols-install.results.commit)
        - name: openshift-version-prefix
          value: "$(params.openshift-version-prefix)."
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
        - name: clusterCredentialsSecretRef
          value: $(tasks.provision-ephemeral-cluster.results.secretRef)
      runAfter:
        - ols-install
      taskSpec:
        params:
          - name: commit
          - name: openshift-version-prefix
            type: string
          - name: SNAPSHOT
            type: string
          - name: clusterCredentialsSecretRef
            type: string
        volumes:
          - name: azure-openai-token
            secret:
              secretName: azureopenai-apitoken
          - name: azureopenai-entra-id
            secret:
              secretName: azureopenai-entra-id
          - name: bam-token
            secret:
              secretName: bam-apitoken
          - name: openai-token
            secret:
              secretName: openai
          - name: watsonx-token
            secret:
              secretName: watsonx-apitoken
          - name: insights-stage-upload-offline-token
            secret:
              secretName: insights-stage-upload-offline-token
          - name: ols-konflux-artifacts-bot-creds
            secret:
              secretName: ols-konflux-artifacts-bot
          - name: vertex-token
            secret:
              secretName: vertex-apitoken
          - name: bedrock-token
            secret:
              secretName: bedrock-apitoken
          - name: bedrock-role-token
            secret:
              secretName: bedrock-role-apitoken
          - name: cluster-credentials
            secret:
              secretName: $(params.clusterCredentialsSecretRef)
        steps:
          - name: run-e2e-tests
            onError: continue
            volumeMounts:
              - name: azure-openai-token
                mountPath: /var/run/azure_openai
              - name: azureopenai-entra-id
                mountPath: /var/run/azureopenai-entra-id
              - name: bam-token
                mountPath: /var/run/bam
              - name: openai-token
                mountPath: /var/run/openai
              - name: watsonx-token
                mountPath: /var/run/watsonx
              - name: vertex-token
                mountPath: /var/run/vertex
              - name: bedrock-token
                mountPath: /var/run/bedrock
              - name: bedrock-role-token
                mountPath: /var/run/bedrock-role
              - name: insights-stage-upload-offline-token
                mountPath: /var/run/insights-stage-upload-offline-token
              - name: cluster-credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: BAM_PROVIDER_KEY_PATH
                value: "/var/run/bam/token"
              - name: AZUREOPENAI_PROVIDER_KEY_PATH
                value: "/var/run/azure_openai/token"
              - name: OPENAI_PROVIDER_KEY_PATH
                value: "/var/run/openai/token"
              - name: WATSONX_PROVIDER_KEY_PATH
                value: "/var/run/watsonx/token"
              - name: VERTEX_PROVIDER_KEY_PATH
                value: "/var/run/vertex/token"
              - name: BEDROCK_AWS_ACCESS_KEY_ID
                value: "/var/run/bedrock/aws_access_key_id"
              - name: BEDROCK_AWS_SECRET_ACCESS_KEY
                value: "/var/run/bedrock/aws_secret_access_key"
              - name: BEDROCK_ROLE_AWS_ACCESS_KEY_ID
                value: "/var/run/bedrock-role/aws_access_key_id"
              - name: BEDROCK_ROLE_AWS_SECRET_ACCESS_KEY
                value: "/var/run/bedrock-role/aws_secret_access_key"
              - name: BEDROCK_ROLE_ARN
                value: "arn:aws:iam::103138678430:role/BedrockAccessRole"
              - name: KUBECONFIG
                value: "/credentials/kubeconfig"
              - name: ARTIFACT_DIR
                value: "/workspace/artifacts"
              - name: SUITE_ID
                value: "nosuite"
              - name: KONFLUX_BOOL
                value: "true"
              - name: OLS_IMAGE
                value: ""
              - name: BUNDLE_COMMIT_SHA
                value: "$(params.commit)"
              - name: SNAPSHOT
                value: $(params.SNAPSHOT)
              - name: KONFLUX_COMPONENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['appstudio.openshift.io/component']
              - name: ARTIFACT_DIR
                value: "/workspace"
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              dnf -y install git make golang jq gpgme-devel yq
              git init lightspeed-operator
              cd lightspeed-operator
              git remote add origin https://github.com/openshift/lightspeed-operator.git
              export COMMIT_SHA="${BUNDLE_COMMIT_SHA}"
              git fetch --depth=1 --filter=blob:none origin "${BUNDLE_COMMIT_SHA}"
              git checkout "${BUNDLE_COMMIT_SHA}"
              git show "${BUNDLE_COMMIT_SHA}:.tekton/integration-tests/scripts/run-operator-upgrade-tests.sh" | bash -s -- "$(params.openshift-version-prefix)"
          - name: gather-cluster-resources
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/openshift/lightspeed-operator
                - name: revision
                  value: $(params.commit)
                - name: pathInRepo
                  value: .tekton/integration-tests/stepactions/gather-cluster-resources/0.1/gather-cluster-resources.yaml
            params:
              - name: credentials
                value: "cluster-credentials"
              - name: kubeconfig
                value: "kubeconfig"
              - name: artifact-dir
                value: "/workspace/konflux-artifacts"
              - name: gather-script-url
                value: "https://raw.githubusercontent.com/openshift/lightspeed-operator/$(params.commit)/.tekton/integration-tests/scripts/gather-extra.sh"
          # validate that the cluster resources are available in another tekton step
          - name: list-artifacts
            onError: continue
            image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
            workingDir: "/workspace"
            script: |
              #!/bin/bash
              ls -la /workspace
          - name: push-artifacts
            onError: continue
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: /workspace
              - name: oci-ref
                value: "quay.io/openshift-lightspeed/ols-operator-artifacts:$(params.commit)"
              - name: credentials-volume-name
                value: ols-konflux-artifacts-bot-creds
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
  finally:
    - name: deprovision-ephemeral-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/openshift/konflux-tasks
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/deprovision-ephemeral-cluster/0.1/deprovision-ephemeral-cluster.yaml
      params:
        - name: testPlatformClusterClaimName
          value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimName)
        - name: testPlatformClusterClaimNamespace
          value: $(tasks.provision-ephemeral-cluster.results.testPlatformClusterClaimNamespace)
    - name: export-logs-for-retention
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/export-logs/0.1/export-logs-to-quay.yaml
      params:
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)
        - name: namespace
          value: $(context.pipelineRun.namespace)
        - name: quay-repo
          value: "quay.io/openshift-lightspeed/ols-operator-artifacts"
        - name: artifact-credentials-secret
          value: ols-konflux-artifacts-bot
