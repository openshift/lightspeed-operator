# IntegrationTestScenario resources for Konflux (appstudio.redhat.com/v1beta2).
# Apply to your tenant namespace (e.g. crt-nshift-lightspeed-tenant). Each scenario points at the
# shared pipeline files in this repo and passes the OpenShift minor as a pipeline parameter.
#
# All E2E scenarios run only for pull-request snapshots; push builds still produce images.
# Bundle scenarios default to bundle install-mode; *-direct scenarios use direct install-mode.
# Konflux contexts are OR-ed, so do not add a component_* context alongside pull_request.
# PRs for any component in the shared ols application start a scenario PipelineRun;
# the pipeline checks the component label before provisioning a cluster.
#
# Resolver paths are relative to repo root (leading slash optional; Konflux accepts both).
---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  name: operator-e2e-tests-416
  namespace: crt-nshift-lightspeed-tenant
  labels:
    test.appstudio.openshift.io/optional: "true"
spec:
  application: ols
  contexts:
    - description: Operator bundle e2e on OCP 4.16
      name: pull_request
  params:
    - name: test-name
      value: ols-e2e-tests-4.16
    - name: namespace
      value: openshift-lightspeed
    - name: openshift-version-prefix
      value: "4.16."
    - name: artifact-oci-tag-prefix
      value: "416"
  resolverRef:
    resolver: git
    resourceKind: pipeline
    params:
      - name: url
        value: https://github.com/openshift/lightspeed-operator
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/integration-tests/pipelines/lightspeed-operator-e2e-test-pipeline.yaml
---
