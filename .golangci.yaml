version: "2"

run:
   timeout: 5m
   tests: false
   modules-download-mode: readonly
output:
   formats:
      text:
         path: stdout
         colors: true
linters:
   default: none
   enable:
   - errcheck
   - govet
   - gosec
   - ineffassign
   - staticcheck
   - unused
   exclusions:
      paths:
      - test/
formatters:
   enable:
   - goimports
   settings:
      goimports:
         local-prefixes:
         - github.com/openshift/lightspeed-operator
